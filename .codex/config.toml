[mcp_servers.mlflow-mcp]
command = "/home/wsl_user/.local/bin/uv"
args = ["run", "--with", "mlflow[mcp]==3.8.1", "mlflow", "mcp", "run"]
startup_timeout_sec = 60

[mcp_servers.mlflow-mcp.env]
MLFLOW_TRACKING_URI = "http://localhost:5001"

[mcp_servers.playwright]
command = "npx"
args = ["-y", "@playwright/mcp", "--config", "/home/wsl_user/.codex/playwright/config.json"]

[mcp_servers.playwright.env]
DISPLAY = ":0"
NPM_CONFIG_CACHE = "/tmp/npm-cache"
NPM_CONFIG_PREFIX = "/tmp/npm-prefix"

[mcp_servers.claude-code]
command = "/home/wsl_user/.local/bin/claude"
args = ["--model", "fable", "--effort", "xhigh", "--permission-mode", "bypassPermissions", "mcp", "serve"]
startup_timeout_sec = 60
