services:
  db:
    image: postgis/postgis:15-3.4
    shm_size: 256m
    environment:
      POSTGRES_DB: insar
      POSTGRES_USER: insar
      POSTGRES_PASSWORD: insar
    ports:
      - "5432:5432"
    volumes:
      - insar_db:/var/lib/postgresql/data

  mlflow:
    build: ./docker/mlflow
    image: insar-mlflow:3.8.1
    working_dir: /app
    ports:
      - "5001:5001"
    environment:
      MLFLOW_SERVER_ALLOWED_HOSTS: "*"
    volumes:
      - ./mlruns:/mlruns
    command: >
      mlflow server --host 0.0.0.0 --port 5001
        --backend-store-uri sqlite:////mlruns/mlflow.db
        --default-artifact-root /mlruns

volumes:
  insar_db:
